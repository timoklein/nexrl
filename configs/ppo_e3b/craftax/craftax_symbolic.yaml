env: "craftax/Craftax-Symbolic-v1"
agent_kwargs:
  activation: tanh
  hidden_layer_sizes: [512, 512, 512]
num_envs: 1024
num_steps: 64
num_epochs: 4
num_minibatches: 8
learning_rate: 0.0002
max_grad_norm: 1.0
total_timesteps: 1_000_000_000
eval_freq: 1_000_000
gamma: 0.99
gae_lambda: 0.8
clip_eps: 0.2
ent_coef: 0.01
vf_coef: 0.5
intrinsic_reward_coef: 1.0
icm_latent_size: 32
icm_hidden_layer_sizes: [256, 256, 256]
icm_forward_loss_coef: 1.0
icm_inverse_loss_coef: 1.0
icm_loss_coef: 1.0
intrinsic_gamma: 0.99
intrinsic_reward_norm: true
e3b_lambda: 0.1
e3b_reward_coef: 1.0
