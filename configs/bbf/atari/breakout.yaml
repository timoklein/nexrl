env: atari/Breakout-v5
num_envs: 4
# 110000, not 200000: a 100k-env-step run stores exactly 100k transitions (25000 iters x 4
# envs) and the circular buffer never wraps, so 110000 holds every transition with identical
# indices/priorities/sampling as any larger capacity — byte-identical training. 200000's obs
# array (5.26 GiB) plus its transient jit_collect copy OOMs a 40GB GPU.
buffer_size: 110000
fill_buffer: 2000
batch_size: 32
# num_epochs scaled with num_envs to keep RR=8 grad-steps per env-step
# (8 grad updates per env step * 4 env steps per outer iter = 32)
num_epochs: 32
total_timesteps: 100000
eval_freq: 10000
# C51
n_atoms: 51
v_min: -10.0
v_max: 10.0
# N-step annealing
n_step: 3
max_n_step: 10
# Gamma annealing
gamma: 0.997
min_gamma: 0.97
# Reset schedule
cycle_steps: 10000
# Reference resets every 40,000 GRADIENT steps ("Change if you change the replay
# ratio" — SR_SPR.gin/BBF.gin). At RR8 (num_epochs=32 / num_envs=4 = 8 grad steps
# per env step) that is 40000/8 = 5000 ENV steps, matching SR_SPR.gin reset_every=5000.
# The old 20000 was the RR2 value (40000/2): at RR8 it gave only 4 resets over the run
# instead of ~19, i.e. effectively BBF-without-resets (ablation Breakout ~35 vs full ~357).
reset_every: 5000
no_resets_after: 100000
# Shrink-and-perturb
shrink_factor: 0.5
perturb_factor: 0.5
# SPR
spr_weight: 5.0
jumps: 5
# Network — encoder output dim (= SPR projection dim, matches reference hidden_dim=2048)
hidden_dim: 2048
# Mixed precision: bfloat16 for matmul/conv, fp32 for LN/softmax/SPR-norms.
compute_dtype: bfloat16
# Optimizer
learning_rate: 1.0e-4
weight_decay: 0.1
max_grad_norm: 10.0
# Target
target_update_tau: 0.005
target_action_selection: true
# Exploration
epsilon_train: 0.0
epsilon_eval: 0.001
epsilon_decay_period: 2000
# Augmentation
data_augmentation: true
shift_pad: 4
# Terminal-on-life-loss (Schwarzer's BBF runner): per-life agent terminal, game
# continues across lives, train_return/eval stay full-game.
terminal_on_life_loss: true
# Reward clipping to [-1,1] for training (buffer/targets); train_return stays raw
clip_rewards: true
# PER
per_alpha: 0.5
per_beta: 0.5
per_eps: 1.0e-6
# Standard
normalize_observations: false
normalize_rewards: false
run_evaluation: true
# Skip the step-0 eval: on the UNTRAINED net the greedy policy is degenerate — if its fixed
# argmax on the start frame isn't FIRE, the ball never launches and each of the 128 eval games
# runs to the 27000-step cap, i.e. a multi-hour, useless eval (return ~0). Real evals (step>0)
# play normal games that end on life loss. (Latent all along; the in-step-reset eval fix exposed
# it — the old buggy eval env got stuck after 1 game/lane, hiding the cost.)
skip_initial_evaluation: true
# Encoder
encoder_kwargs:
  encoder: impala
  features_dim: 2048
  width_scale: 4
