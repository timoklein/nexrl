env: CartPole-v1
num_envs: 8
buffer_size: 100000
fill_buffer: 1000
batch_size: 256
total_timesteps: 500000
eval_freq: 5000
gamma: 0.99
# Network dims (smaller for gymnax)
hidden_dim: 256
zs_dim: 256
za_dim: 128
zsa_dim: 256
activation: elu
# Encoder
enc_learning_rate: 0.0001
enc_weight_decay: 0.0001
enc_horizon: 5
dyn_weight: 1.0
reward_weight: 0.1
done_weight: 0.1
# Value
value_learning_rate: 0.0003
value_weight_decay: 0.0001
value_grad_clip: 20.0
q_horizon: 3
# Policy
policy_learning_rate: 0.0003
policy_weight_decay: 0.0001
policy_activation: relu
pre_activ_weight: 0.00001
# Target updates
target_update_freq: 250
# PER
per_alpha: 0.4
min_priority: 1.0
# Reward bins
reward_num_bins: 65
reward_lower: -10.0
reward_upper: 10.0
# Standard
normalize_observations: false
run_evaluation: true
