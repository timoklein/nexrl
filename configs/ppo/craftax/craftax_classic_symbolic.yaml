env: "craftax/Craftax-Classic-Symbolic-v1"
agent_kwargs:
  activation: tanh
  hidden_layer_sizes: [512, 512]
num_envs: 1024
num_steps: 64
num_epochs: 4
num_minibatches: 8
learning_rate: 0.0002
anneal_lr: true
max_grad_norm: 1.0
total_timesteps: 1_000_000_000
eval_freq: 1_000_000
gamma: 0.99
gae_lambda: 0.8
clip_eps: 0.2
ent_coef: 0.01
vf_coef: 0.5
