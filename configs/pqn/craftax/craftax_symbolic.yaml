env: "craftax/Craftax-Symbolic-v1"
norm_type: layer_norm
norm_input: true
agent_kwargs:
  activation: relu
  hidden_layer_sizes: [1024, 1024, 1024, 1024]
num_envs: 1024
num_steps: 1
num_epochs: 1
num_minibatches: 1
learning_rate: 0.0001
max_grad_norm: 1.0
total_timesteps: 1_000_000_000
eval_freq: 1_000_000
gamma: 0.99
td_lambda: 0.0
eps_start: 0.1
eps_end: 0.005
exploration_fraction: 0.2
