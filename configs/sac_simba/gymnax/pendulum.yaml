env: Pendulum-v1
actor_kwargs:
  hidden_dim: 128
  num_blocks: 1
critic_kwargs:
  hidden_dim: 512
  num_blocks: 2
num_envs: 1
buffer_size: 10000
fill_buffer: 256
batch_size: 256
actor_learning_rate: 0.0001
critic_learning_rate: 0.0001
alpha_learning_rate: 0.0001
actor_weight_decay: 0.01
critic_weight_decay: 0.01
initial_alpha: 0.01
target_entropy_coef: -0.5
num_epochs: 2
total_timesteps: 10000
eval_freq: 100
gamma: 0.99
polyak: 0.995
normalize_observations: true
