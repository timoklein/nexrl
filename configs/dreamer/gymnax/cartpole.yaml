env: CartPole-v1
agent_kwargs:
  activation: silu
  hidden_layer_sizes: [256, 256]
rssm_kwargs:
  deter_dim: 256
  stoch_categories: 16
  stoch_classes: 16
  hidden_dim: 256
  unimix: 0.01
num_envs: 8
buffer_size: 100000
fill_buffer: 500
batch_size: 16
sequence_length: 32
imagination_horizon: 15
# 4 grad steps per env step — faster iteration, still good learning
num_epochs: 4
learning_rate: 0.0003
max_grad_norm: 100.0
total_timesteps: 500000
eval_freq: 5000
gamma: 0.997
lambda_gae: 0.95
recon_scale: 1.0
reward_scale: 1.0
continue_scale: 1.0
dyn_scale: 1.0
rep_scale: 0.1
kl_free_bits: 1.0
ent_coef: 0.0003
value_num_bins: 255
slow_value_rate: 0.02
normalize_observations: false
run_evaluation: true
