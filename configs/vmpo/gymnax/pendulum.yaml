env: Pendulum-v1
total_timesteps: 524288
eval_freq: 4096
num_envs: 64
num_steps: 16
num_minibatches: 16
num_epochs: 10
learning_rate: 0.0003
critic_learning_rate: 0.0003
dual_learning_rate: 0.01
gamma: 0.99
gae_lambda: 0.95
vf_coef: 0.5
epsilon: 0.1
epsilon_mean: 0.001
epsilon_stddev: 0.000001
per_dim_constraining: true
top_k_fraction: 0.5
actor_target_period: 10
init_log_alpha_mean: 1.0
init_log_alpha_stddev: 1.0
actor_kwargs:
  activation: tanh
  hidden_layer_sizes: [64, 64]
critic_kwargs:
  activation: tanh
  hidden_layer_sizes: [64, 64]
