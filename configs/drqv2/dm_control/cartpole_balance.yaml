env: dm_control/cartpole-balance-v0
feature_dim: 50
hidden_layer_sizes: [1024, 1024]
num_envs: 1
buffer_size: 100000
seed_frames: 4000
batch_size: 256
n_step: 3
total_timesteps: 200000
