env: CartPole-v1
num_envs: 8
buffer_size: 100000
fill_buffer: 1000
batch_size: 256
total_timesteps: 500000
eval_freq: 5000
gamma: 0.99
# Network dims (smaller for gymnax)
hidden_dim: 256
zs_dim: 256
za_dim: 128
zsa_dim: 256
activation: elu
num_critics: 10
sem_groups: 8
# Encoder
enc_learning_rate: 0.0001
enc_weight_decay: 0.0001
enc_horizon: 5
dyn_weight: 20.0
reward_weight: 0.1
done_weight: 1.0
# Value
value_learning_rate: 0.0003
value_weight_decay: 0.0001
value_grad_clip: 20.0
q_horizon: 3
# Policy
policy_learning_rate: 0.0003
policy_weight_decay: 0.0001
policy_activation: relu
pre_activ_weight: 0.00001
# Exploration (MPPI replaces policy+noise)
exploration_noise: 0.0
# Target updates
target_update_freq: 250
# PER
per_alpha: 0.4
min_priority: 1.0
# Reward bins
reward_num_bins: 65
reward_lower: -10.0
reward_upper: 10.0
# MPPI planning
mpc_horizon: 3
num_samples: 512
num_pi_trajs: 24
num_elites: 64
mpc_iterations: 6
mpc_temperature: 0.5
min_std: 0.05
max_std: 2.0
pi_std: 0.1
# Standard
normalize_observations: false
run_evaluation: true
