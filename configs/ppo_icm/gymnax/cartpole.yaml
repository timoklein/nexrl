env: CartPole-v1
agent_kwargs:
  activation: tanh
num_envs: 5
num_steps: 100
num_epochs: 5
num_minibatches: 5
learning_rate: 0.00075
max_grad_norm: 0.5
total_timesteps: 100000
eval_freq: 1000
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
ent_coef: 0.01
vf_coef: 0.5
intrinsic_reward_coef: 0.01
icm_latent_size: 64
icm_hidden_layer_sizes: [256, 256]
icm_forward_loss_coef: 1.0
icm_inverse_loss_coef: 1.0
icm_loss_coef: 1.0
intrinsic_gamma: 0.99
intrinsic_reward_norm: true
